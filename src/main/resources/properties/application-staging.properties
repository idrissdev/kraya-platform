# application-staging.properties
logging.level.root=WARN

# PostgreSQL Database Configuration for Staging
spring.datasource.url=jdbc:postgresql://localhost:5432/kraya_platform_staging
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:kraya}
spring.datasource.password=${DB_PASSWORD:slimatech}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=on_param
